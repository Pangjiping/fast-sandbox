name: OpenSandbox Integration

# Pre-merge integration testing against the OpenSandbox monorepo: every PR
# dispatches the OpenSandbox "Fast Sandbox Integration Tests" workflow with
# this PR's head SHA, so a fast-sandbox change is validated against the full
# OpenSandbox stack before it can be pinned into OpenSandbox
# (manifests/third-party/fast-sandbox.commit).
#
# Requires two secrets holding a GitHub App installation scoped to the
# OpenSandbox repository (Contents: read/write, no webhooks):
#   OSB_APP_ID           the app's numeric ID
#   OSB_APP_PRIVATE_KEY  the app's .pem private key contents
# A short-lived installation token is minted per run; nothing is tied to a
# personal account. Read-only otherwise.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      fsb_commit:
        description: 'fast-sandbox commit to test on OpenSandbox (default: current ref head)'
        required: false
        type: string

concurrency:
  group: opensandbox-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Trigger OpenSandbox fast-sandbox integration
    # OpenSandbox's self-hosted KVM runner executes the tested fast-sandbox
    # source, so only trusted authors trigger automatically: org members and
    # repo collaborators (the people who could push org branches anyway).
    # Drive-by fork PRs stay opt-in via manual workflow_dispatch with an
    # explicit SHA.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FSB_COMMIT: ${{ inputs.fsb_commit || github.event.pull_request.head.sha }}
    steps:
      - name: Mint GitHub App installation token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.OSB_APP_ID }}
          private-key: ${{ secrets.OSB_APP_PRIVATE_KEY }}
          owner: opensandbox-group
          repositories: OpenSandbox

      - name: Dispatch OpenSandbox fast-sandbox integration tests
        env:
          OSB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "fast-sandbox @ ${FSB_COMMIT:-<pinned>}"
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $OSB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/opensandbox-group/OpenSandbox/dispatches \
            -d '{"event_type":"fast-sandbox-pr","client_payload":{"fsb_commit":"'"$FSB_COMMIT"'","pr":"${{ github.event.pull_request.number }}"}}'
