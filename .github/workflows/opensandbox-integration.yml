name: OpenSandbox Integration

# Pre-merge integration testing against the OpenSandbox monorepo: PRs
# dispatch the OpenSandbox "Fast Sandbox Integration Tests" workflow with
# the PR head SHA, so a fast-sandbox change is validated against the full
# OpenSandbox stack before it can be pinned into OpenSandbox
# (manifests/third-party/fast-sandbox.commit).
#
# pull_request_target (NOT pull_request) is deliberate: the workflow file is
# always taken from the base branch, so PRs can neither tamper with the
# guard logic nor reach the secrets, and secrets stay available for fork
# PRs. The job only reads event metadata and calls the API — it never
# checks out or executes PR code.
#
# Who triggers it:
#   - org members and repo collaborators: automatically on every code PR
#   - external contributors: once a maintainer adds the `ok-to-test` label
#     (their PR code runs on OpenSandbox's self-hosted KVM runner, so a
#     trusted person opts in explicitly)
#   - anyone with actions access: manual workflow_dispatch with an explicit
#     SHA
#
# Requires two secrets holding a GitHub App installation scoped to the
# OpenSandbox repository (Contents: read/write, no webhooks):
#   OSB_APP_ID           the app's numeric ID
#   OSB_APP_PRIVATE_KEY  the app's .pem private key contents
# A short-lived installation token is minted per run; nothing is tied to a
# personal account. Read-only otherwise.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      fsb_commit:
        description: 'fast-sandbox commit to test on OpenSandbox (default: current ref head)'
        required: false
        type: string

concurrency:
  group: opensandbox-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Trigger OpenSandbox fast-sandbox integration
    # OpenSandbox's self-hosted KVM runner executes the tested fast-sandbox
    # source, so running it for a PR is an explicit trust decision: trusted
    # authors (org members / repo collaborators) run automatically; anyone
    # else needs a maintainer to add the `ok-to-test` label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FSB_COMMIT: ${{ inputs.fsb_commit || github.event.pull_request.head.sha }}
    steps:
      - name: Mint GitHub App installation token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.OSB_APP_ID }}
          private-key: ${{ secrets.OSB_APP_PRIVATE_KEY }}
          owner: opensandbox-group
          repositories: OpenSandbox

      - name: Dispatch OpenSandbox fast-sandbox integration tests
        env:
          OSB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "fast-sandbox @ ${FSB_COMMIT:-<pinned>}"
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $OSB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/opensandbox-group/OpenSandbox/dispatches \
            -d '{"event_type":"fast-sandbox-pr","client_payload":{"fsb_commit":"'"$FSB_COMMIT"'","pr":"${{ github.event.pull_request.number }}"}}'
