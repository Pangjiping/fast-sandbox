name: OpenSandbox Integration

# Dispatches OpenSandbox's "Fast Sandbox Integration Tests" KVM workflow with
# the PR head SHA, pre-merge. pull_request_target keeps the workflow file and
# secrets on the base branch (PRs can't rewrite the guard or mint tokens); the
# job only calls the API, never checks out PR code. External PRs need a
# maintainer-added `ok-to-test` label — their code runs on a self-hosted
# runner. Requires OSB_APP_ID / OSB_APP_PRIVATE_KEY (GitHub App with Contents
# read/write, installed on the OpenSandbox repo only).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      fsb_commit:
        description: 'fast-sandbox commit to test on OpenSandbox (default: current ref head)'
        required: false
        type: string

concurrency:
  group: opensandbox-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Trigger OpenSandbox fast-sandbox integration
    # Untrusted PRs need a maintainer's ok-to-test label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR' ||
      contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FSB_COMMIT: ${{ inputs.fsb_commit || github.event.pull_request.head.sha }}
    steps:
      - name: Mint GitHub App installation token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.OSB_APP_ID }}
          private-key: ${{ secrets.OSB_APP_PRIVATE_KEY }}
          owner: opensandbox-group
          repositories: OpenSandbox

      - name: Dispatch OpenSandbox fast-sandbox integration tests
        env:
          OSB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "fast-sandbox @ ${FSB_COMMIT:-<pinned>}"
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $OSB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/opensandbox-group/OpenSandbox/dispatches \
            -d '{"event_type":"fast-sandbox-pr","client_payload":{"fsb_commit":"'"$FSB_COMMIT"'","pr":"${{ github.event.pull_request.number }}"}}'
