syntax = "proto3";

package fastpath.v2;

option go_package = "fast-sandbox/api/proto/v2;fastpathv2";

service FastPathService {
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc DeleteSandbox(DeleteRequest) returns (DeleteResponse);
  rpc UpdateSandbox(UpdateSandboxRequest) returns (UpdateSandboxResponse);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  rpc GetSandbox(GetSandboxRequest) returns (GetSandboxResponse);
  rpc GetSandboxDiagnostics(SandboxDiagnosticsRequest) returns (SandboxDiagnosticsResponse);
  rpc ResolveEndpoint(ResolveEndpointRequest) returns (ResolveEndpointResponse);
  rpc GetPool(GetPoolRequest) returns (PoolInfo);
  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse);
}

message NamespacedName {
  string namespace = 1;
  string name = 2;
}

message SandboxReference {
  reserved 1;
  reserved "sandbox_uid";
  NamespacedName namespaced_name = 2;
  string expected_uid = 3;
}

message SandboxIdentity {
  string uid = 1;
  string name = 2;
  string namespace = 3;
}

enum FailurePolicy {
  MANUAL = 0;
  AUTO_RECREATE = 1;
}

enum RuntimeState {
  RUNTIME_STATE_UNSPECIFIED = 0;
  RUNTIME_STATE_UNKNOWN = 1;
  RUNTIME_STATE_PENDING = 2;
  RUNTIME_STATE_CREATING = 3;
  RUNTIME_STATE_READY = 4;
  RUNTIME_STATE_STOPPING = 5;
  RUNTIME_STATE_STOPPED = 6;
  RUNTIME_STATE_FAILED = 7;
  RUNTIME_STATE_UNAVAILABLE = 8;
}

enum DataPlaneState {
  DATA_PLANE_STATE_UNSPECIFIED = 0;
  DATA_PLANE_STATE_UNKNOWN = 1;
  DATA_PLANE_STATE_PENDING = 2;
  DATA_PLANE_STATE_PUBLISHING = 3;
  DATA_PLANE_STATE_READY = 4;
  DATA_PLANE_STATE_DRAINING = 5;
  DATA_PLANE_STATE_FAILED = 6;
  DATA_PLANE_STATE_UNAVAILABLE = 7;
}

enum InfraComponentState {
  INFRA_COMPONENT_STATE_UNSPECIFIED = 0;
  INFRA_COMPONENT_STATE_STARTING = 1;
  INFRA_COMPONENT_STATE_READY = 2;
  INFRA_COMPONENT_STATE_FAILED = 3;
}

enum ActionState {
  ACTION_STATE_UNSPECIFIED = 0;
  ACTION_STATE_PENDING = 1;
  ACTION_STATE_APPLYING = 2;
  ACTION_STATE_READY = 3;
  ACTION_STATE_FAILED = 4;
}

message RuntimeInfo {
  RuntimeState state = 1;
  reserved 2, 3;
  reserved "last_transition_unix_seconds", "message";
}

message DataPlaneInfo {
  DataPlaneState state = 1;
  reserved 2, 3;
  reserved "last_transition_unix_seconds", "message";
}

message InfraComponentInfo {
  string name = 1;
  InfraComponentState state = 2;
  reserved 3;
  reserved "last_transition_unix_seconds";
  string message = 4;
}

message ActionBindingInfo {
  string handler = 1;
  ActionState state = 2;
  int64 last_transition_unix_seconds = 3;
  string message = 4;
}

message SandboxInfo {
  SandboxIdentity identity = 1;
  int64 applied_generation = 2;
  RuntimeInfo runtime = 3;
  DataPlaneInfo data_plane = 4;
  repeated InfraComponentInfo infra_components = 5;
  repeated ActionBindingInfo action_bindings = 6;
  bool ready = 7;
}

message ActionBinding {
  string handler = 1;
  string input = 2;
}

enum CreateCompletion {
  CREATE_COMPLETION_UNSPECIFIED = 0;
  CREATE_COMPLETION_READY = 1;
  CREATE_COMPLETION_RUNTIME_READY = 2;
}

message CreateSandboxRequest {
  string request_id = 1;
  string namespace = 2;
  string image = 3;
  string pool_ref = 4;
  repeated string command = 5;
  repeated string args = 6;
  map<string, string> envs = 7;
  string working_dir = 8;
  int64 expires_at_unix_seconds = 9;
  map<string, string> metadata = 10;
  FailurePolicy failure_policy = 11;
  int32 recovery_timeout_seconds = 12;
  repeated ActionBinding action_bindings = 13;
  CreateCompletion completion = 14;
}

message CreateSandboxResponse {
  SandboxInfo sandbox = 1;
  int64 generation = 2;
  CreateCompletion completion = 3;
}

message GetSandboxRequest {
  SandboxReference sandbox = 1;
  int64 expected_generation = 2;
}

message GetSandboxResponse {
  SandboxInfo sandbox = 1;
  int64 generation = 2;
}

message SandboxSummary {
  SandboxIdentity identity = 1;
  int64 generation = 2;
}

message ListSandboxesRequest {
  string namespace = 1;
  map<string, string> metadata = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListSandboxesResponse {
  repeated SandboxSummary items = 1;
  string next_page_token = 2;
}

message DeleteRequest {
  reserved 1, 2;
  reserved "sandbox_name", "namespace";
  SandboxReference sandbox = 3;
}

message DeleteResponse {
  bool success = 1;
}

message ReplaceActionBindings {
  repeated ActionBinding items = 1;
}

message UpdateSandboxRequest {
  SandboxReference sandbox = 1;
  int64 expected_generation = 2;

  oneof update {
    int64 expires_at_unix_seconds = 3;
    string reset_revision = 4;
    FailurePolicy failure_policy = 5;
    int32 recovery_timeout_seconds = 6;
    ReplaceActionBindings action_bindings = 7;
  }

  map<string, string> metadata_upsert = 8;
  repeated string metadata_delete_keys = 9;
}

message UpdateSandboxResponse {
  SandboxIdentity sandbox = 1;
  int64 committed_generation = 2;
}

message SandboxDiagnosticsRequest {
  string sandbox_name = 1;
  string namespace = 2;
  int32 limit = 3;
}

message SandboxDiagnosticEvent {
  int64 timestamp_unix_nano = 1;
  string level = 2;
  string source = 3;
  string phase = 4;
  string message = 5;
}

message SandboxDiagnosticsResponse {
  SandboxInfo sandbox = 1;
  string assignment_state = 2;
  string runtime_instance_id = 3;
  int64 assignment_attempt = 4;
  bool fastlet_reachable = 5;
  string fastlet_error = 6;
  repeated SandboxDiagnosticEvent events = 7;
}

message EndpointTarget {
  oneof target {
    string component_name = 1;
    uint32 port = 2;
  }
}

enum EndpointAccessMode {
  CENTRAL_PROXY = 0;
  DIRECT_FASTLET_PROXY = 1;
}

message ResolveEndpointRequest {
  SandboxReference sandbox = 1;
  EndpointTarget target = 2;
  EndpointAccessMode access_mode = 3;
  int64 expected_generation = 4;
}

message ResolveEndpointResponse {
  string sandbox_uid = 1;
  EndpointTarget target = 2;
  string component_name = 3;
  string protocol = 4;
  uint32 resolved_port = 5;
  string proxy_endpoint = 6;
  map<string, string> required_headers = 7;
  int64 route_generation = 8;
  int64 expires_at_unix_seconds = 9;
}

message ComponentCapability {
  string name = 1;
  string protocol = 2;
  uint32 port = 3;
  string health_kind = 4;
}

message WarmImageInfo {
  string image = 1;
  int32 desired_fastlets = 2;
  int32 cached_fastlets = 3;
  int32 pulling_fastlets = 4;
  int32 failed_fastlets = 5;
  int64 observed_generation = 6;
  string last_error = 7;
}

message PoolInfo {
  string namespace = 1;
  string name = 2;
  string runtime = 3;
  string sandbox_cpu = 4;
  string sandbox_memory = 5;
  int64 sandbox_pids = 6;
  int32 max_sandboxes_per_pod = 7;
  int32 total_fastlets = 8;
  int32 ready_fastlets = 9;
  int32 idle_fastlets = 10;
  string runtime_revision = 11;
  string infra_revision = 12;
  string fastlet_revision = 13;
  int32 prepared_fastlets = 14;
  repeated ComponentCapability components = 15;
  repeated WarmImageInfo warm_images = 16;
}

message GetPoolRequest {
  string namespace = 1;
  string pool_name = 2;
}

message ListPoolsRequest {
  string namespace = 1;
}

message ListPoolsResponse {
  repeated PoolInfo items = 1;
}
