apiVersion: sandbox.fast.io/v1alpha2
kind: SandboxPool
metadata:
  name: quickstart-actions-pool
  namespace: fast-sandbox
spec:
  runtime: container
  actionHandlers:
  - name: egress
    targetHTTPPort: 18080
    hooks:
    - sandbox.runtime-ready
    - sandbox.data-plane-ready
  sandboxResources:
    cpu: 250m
    memory: 256Mi
    pids: 128
  capacity:
    poolMin: 1
    poolMax: 1
    bufferMin: 0
    bufferMax: 0
  maxSandboxesPerPod: 5
  warmImages:
  - docker.io/library/alpine:latest
  fastletTemplate:
    spec:
      containers:
      - name: fastlet
        image: fast-sandbox/fastlet:dev
        imagePullPolicy: IfNotPresent
      - name: sandbox-action-fixture
        image: fast-sandbox/sandbox-action-fixture:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: SANDBOX_ACTION_FIXTURE_ADDRESSES
          value: 127.0.0.1:18080
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 10m
            memory: 16Mi
