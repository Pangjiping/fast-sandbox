apiVersion: v1
kind: Pod
metadata:
  name: fast-sandbox-kata-verification
spec:
  restartPolicy: Never
  runtimeClassName: kata-qemu
  containers:
    - name: verify
      image: docker.io/library/alpine:3.20
      command:
        - /bin/sh
        - -ec
        - test -r /proc/version && uname -a
